name: Verify Stremio Jackett Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stremio-jackett-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Check Python syntax
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          for file in Path("source").rglob("*.py"):
              compile(file.read_bytes(), str(file), "exec")
          print("All Python files compile")
          PYCODE
      - name: Enable QEMU emulation
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build ARM64 and AMD64 images (verify only)
        uses: docker/build-push-action@v6
        with:
          context: ./source
          file: ./source/Dockerfile
          platforms: linux/arm64,linux/amd64
          push: false
          provenance: false
