name: Verify and Deploy Stremio Jackett

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Separate from the superseded QEMU workflow. The old run will skip deployment
# when it observes that its commit is no longer main.
# Never interrupt an in-progress deployment or rollback.
concurrency:
  group: stremio-jackett-native-build-and-deploy
  cancel-in-progress: false

jobs:
  verify-amd64:
    name: Verify AMD64 natively
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Check Python syntax
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          for file in Path("source").rglob("*.py"):
              compile(file.read_bytes(), str(file), "exec")
          print("All Python files compile")
          PYCODE
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build cached AMD64 Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./source
          file: ./source/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          provenance: false
          tags: stremio-jackett-amd64-test:${{ github.sha }}
          cache-from: type=gha,scope=stremio-jackett-amd64
          cache-to: type=gha,scope=stremio-jackett-amd64,mode=max,ignore-error=true
      - name: Smoke-test AMD64 Addon and full routing regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          image="stremio-jackett-amd64-test:$GITHUB_SHA"
          docker run -d --rm --name stremio-jackett-ci-amd64 -p 127.0.0.1:38680:3000 "$image"
          trap 'docker rm -f stremio-jackett-ci-amd64 >/dev/null 2>&1 || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent --max-time 3 http://127.0.0.1:38680/manifest.json -o /dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent --show-error http://127.0.0.1:38680/manifest.json |
            python3 -c 'import json,sys; assert "stream" in json.load(sys.stdin).get("resources",[])'
          curl --fail --silent --show-error http://127.0.0.1:38680/configure | grep -qi '</html>'
          curl --fail --silent --show-error http://127.0.0.1:38680/static/config.js -o /dev/null
          docker cp deployment/test-routing.py stremio-jackett-ci-amd64:/tmp/test-routing.py
          docker exec -e PYTHONPATH=/app stremio-jackett-ci-amd64 python /tmp/test-routing.py

  build-arm64:
    name: Build and verify ARM64 natively
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Docker Buildx (native ARM64; no QEMU)
        uses: docker/setup-buildx-action@v3
      - name: Build cached ARM64 Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./source
          file: ./source/Dockerfile
          platforms: linux/arm64
          push: false
          load: true
          provenance: false
          tags: stremio-jackett-personal:${{ github.sha }}
          cache-from: type=gha,scope=stremio-jackett-arm64
          cache-to: type=gha,scope=stremio-jackett-arm64,mode=max,ignore-error=true
      - name: Smoke-test ARM64 Addon and full routing regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          image="stremio-jackett-personal:$GITHUB_SHA"
          test "$(docker image inspect "$image" --format '{{.Architecture}}')" = "arm64"
          docker run -d --rm --name stremio-jackett-ci-arm64 -p 127.0.0.1:38680:3000 "$image"
          trap 'docker rm -f stremio-jackett-ci-arm64 >/dev/null 2>&1 || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent --max-time 3 http://127.0.0.1:38680/manifest.json -o /dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent --show-error http://127.0.0.1:38680/manifest.json |
            python3 -c 'import json,sys; assert "stream" in json.load(sys.stdin).get("resources",[])'
          curl --fail --silent --show-error http://127.0.0.1:38680/configure | grep -qi '</html>'
          curl --fail --silent --show-error http://127.0.0.1:38680/static/config.js -o /dev/null
          docker cp deployment/test-routing.py stremio-jackett-ci-arm64:/tmp/test-routing.py
          docker exec -e PYTHONPATH=/app stremio-jackett-ci-arm64 python /tmp/test-routing.py
      - name: Package verified ARM64 image (no rebuild)
        shell: bash
        run: |
          set -Eeuo pipefail
          docker save "stremio-jackett-personal:$GITHUB_SHA" | gzip -1 > stremio-jackett-arm64.tar.gz
          test -s stremio-jackett-arm64.tar.gz
          ls -lh stremio-jackett-arm64.tar.gz
      - name: Upload verified ARM64 image for deployment
        uses: actions/upload-artifact@v4
        with:
          name: stremio-jackett-arm64-image
          path: stremio-jackett-arm64.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  deploy:
    name: Deploy verified ARM64 image (no rebuild)
    needs: [verify-amd64, build-arm64]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - name: Download already-built ARM64 image
        uses: actions/download-artifact@v4
        with:
          name: stremio-jackett-arm64-image
          path: ./deploy-image
      - name: Restore ARM64 image without building
        shell: bash
        run: |
          set -Eeuo pipefail
          gzip -dc ./deploy-image/stremio-jackett-arm64.tar.gz | docker load
          image="stremio-jackett-personal:$GITHUB_SHA"
          test "$(docker image inspect "$image" --format '{{.Architecture}}')" = "arm64"
      - name: Transfer image and deploy to VPS with rollback
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.JACKETT_SSH_HOST }}
          DEPLOY_USER: ${{ secrets.JACKETT_SSH_USER }}
          DEPLOY_KEY: ${{ secrets.JACKETT_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.JACKETT_SSH_KNOWN_HOSTS }}
          DEPLOY_PORT: ${{ secrets.JACKETT_SSH_PORT }}
          AIOMETADATA_BASE_URL: ${{ secrets.AIOMETADATA_BASE_URL || vars.AIOMETADATA_BASE_URL }}
        run: |
          set -Eeuo pipefail
          for variable in DEPLOY_HOST DEPLOY_USER DEPLOY_KEY DEPLOY_KNOWN_HOSTS; do
            if [[ -z "${!variable:-}" ]]; then
              echo "::error::Missing GitHub Actions secret: $variable"
              exit 1
            fi
          done
          if [[ -z "${AIOMETADATA_BASE_URL:-}" ]]; then
            echo "::error::Set AIOMETADATA_BASE_URL in Actions secrets or variables"
            exit 1
          fi
          if [[ "$AIOMETADATA_BASE_URL" != https://* ]]; then
            echo "::error::AIOMETADATA_BASE_URL must be an HTTPS base URL"
            exit 1
          fi
          metadata_url_b64="$(printf '%s' "$AIOMETADATA_BASE_URL" | base64 -w 0)"
          port="${DEPLOY_PORT:-22}"
          [[ "$port" =~ ^[0-9]+$ && "$port" -ge 1 && "$port" -le 65535 ]] || { echo "::error::Invalid JACKETT_SSH_PORT"; exit 1; }
          umask 077
          keyfile="$RUNNER_TEMP/stremio-jackett-deploy-key"
          knownfile="$RUNNER_TEMP/stremio-jackett-known-hosts"
          printf '%s\n' "$DEPLOY_KEY" >"$keyfile"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >"$knownfile"
          trap 'rm -f "$keyfile" "$knownfile"' EXIT
          ssh_args=(-p "$port" -i "$keyfile" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$knownfile" -o ConnectTimeout=20 -o ServerAliveInterval=30)
          remote="$DEPLOY_USER@$DEPLOY_HOST"

          # Avoid transferring a large image when another commit has superseded this run.
          current="$(
            ssh "${ssh_args[@]}" -- "$remote" "sudo -n bash -s -- '$GITHUB_SHA'" <<'REMOTE'
          set -Eeuo pipefail
          sha="$1"
          repo_dir="/home/ubuntu/stremio-jackett-deploy"
          [[ -d "$repo_dir/.git" ]] || { echo "Deploy checkout not initialized: $repo_dir" >&2; exit 1; }
          git -c safe.directory="$repo_dir" -C "$repo_dir" fetch --depth 1 origin main >&2
          fetched="$(git -c safe.directory="$repo_dir" -C "$repo_dir" rev-parse FETCH_HEAD)"
          if [[ "$fetched" != "$sha" ]]; then
            printf 'SKIPPED: Superseded by %s\n' "$fetched"
          else
            printf 'OK\n'
          fi
          REMOTE
          )"
          if [[ "$current" != "OK" ]]; then
            echo "$current"
            [[ "$current" == SKIPPED:* ]] && exit 0
            exit 1
          fi

          image="stremio-jackett-personal:$GITHUB_SHA"
          echo "Transferring already-verified ARM64 image (no VPS compilation)"
          docker save "$image" | gzip -1 | ssh "${ssh_args[@]}" -- "$remote" "gzip -dc | sudo -n docker load"

          ssh "${ssh_args[@]}" -- "$remote" "sudo -n bash -s -- '$GITHUB_SHA' '$metadata_url_b64'" <<'REMOTE'
          set -Eeuo pipefail
          sha="$1"
          export AIOMETADATA_BASE_URL="$(printf '%s' "$2" | base64 --decode)"
          repo_dir="/home/ubuntu/stremio-jackett-deploy"
          git -c safe.directory="$repo_dir" -C "$repo_dir" fetch --depth 1 origin main
          fetched="$(git -c safe.directory="$repo_dir" -C "$repo_dir" rev-parse FETCH_HEAD)"
          if [[ "$fetched" != "$sha" ]]; then
            echo "SKIPPED: Superseded by $fetched"
            exit 0
          fi
          git -c safe.directory="$repo_dir" -C "$repo_dir" checkout --force --detach "$sha"
          exec bash "$repo_dir/deployment/auto-deploy-addon.sh" --deploy-sha "$sha"
          REMOTE
