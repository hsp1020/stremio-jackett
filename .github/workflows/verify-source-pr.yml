name: Verify Jackett pull request

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/phase12-filter-sort-format-20261010]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Python syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for path in Path('source').rglob('*.py'):
              compile(path.read_bytes(), str(path), 'exec')
          compile(Path('deployment/test-routing.py').read_bytes(), 'deployment/test-routing.py', 'exec')
          print('Python syntax verified')
          PY
      - name: Build Docker image
        run: docker build -t stremio-jackett-regression -f source/Dockerfile source
      - name: Run complete mock routing and phase 1/2 tests
        run: |
          docker run --rm \
            -e PYTHONPATH=/app \
            -v "$PWD/deployment/test-routing.py:/tmp/test-routing.py:ro" \
            --entrypoint python \
            stremio-jackett-regression /tmp/test-routing.py
